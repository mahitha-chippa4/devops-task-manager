[pytest]
minversion = 8.0
testpaths = tests
pythonpath = .
addopts = -v --strict-markers --junitxml=test-results/junit.xml --cov=app --cov-report=term-missing --cov-report=xml:test-results/coverage.xml
junit_family = xunit2
filterwarnings =
    ignore::DeprecationWarning
    ignore:.*StarletteDeprecationWarning.*
    ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*
